name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx1G
          org.gradle.parallel=true

          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          fabric_version=0.141.1+1.21.11

          mod_version=1.0.0
          maven_group=com.speardash
          archives_base_name=speardash
          EOF_FILE
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF_FILE
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "speardash",
            "version": "${version}",
            "name": "Spear Dash",
            "description": "Dash cepat pakai lunge swap spear. Tahan keybind (default G), /spear nyala-mati, /spc buka config.",
            "authors": [],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.speardash.SpearDashClient"]
            },
            "depends": {
              "fabricloader": ">=0.18.1",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/speardash/lang
          cat > src/main/resources/assets/speardash/lang/en_us.json <<'EOF_FILE'
          {
            "key.speardash.dash": "Spear Dash (tahan)",
            "key.category.speardash.main": "Spear Dash"
          }
          EOF_FILE
          mkdir -p src/main/java/com/speardash
          cat > src/main/java/com/speardash/SpearConfig.java <<'EOF_FILE'
          package com.speardash;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          public class SpearConfig {
              /** Mod nyala/mati (toggle lewat /spear). */
              public boolean enabled = true;
              /** Jarak minimal antar lunge saat keybind ditahan (tick, 20 tick = 1 detik). */
              public int intervalTicks = 8;
              /** Hunger minimal supaya dash jalan (Lunge vanilla butuh lebih dari 6). */
              public int minHunger = 7;
              /** 0 = otomatis pilih spear Lunge terbaik di hotbar, 1-9 = slot tetap. */
              public int spearSlot = 0;
              /** Delay balik ke item semula (0 = di tick yang sama). */
              public int swapBackDelay = 0;
              /** true = hanya spear yang punya enchant Lunge. */
              public boolean requireLunge = true;

              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static SpearConfig instance;

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("speardash.json");
              }

              public static SpearConfig get() {
                  if (instance == null) {
                      instance = load();
                  }
                  return instance;
              }

              private static SpearConfig load() {
                  try {
                      Path p = path();
                      if (Files.exists(p)) {
                          SpearConfig c = GSON.fromJson(Files.readString(p), SpearConfig.class);
                          if (c != null) {
                              c.clamp();
                              return c;
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  return new SpearConfig();
              }

              public void clamp() {
                  intervalTicks = Math.max(1, Math.min(40, intervalTicks));
                  minHunger = Math.max(0, Math.min(20, minHunger));
                  spearSlot = Math.max(0, Math.min(9, spearSlot));
                  swapBackDelay = Math.max(0, Math.min(5, swapBackDelay));
              }

              public static void save() {
                  try {
                      get().clamp();
                      Files.writeString(path(), GSON.toJson(get()));
                  } catch (IOException ignored) {
                  }
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/speardash
          cat > src/main/java/com/speardash/SpearDashClient.java <<'EOF_FILE'
          package com.speardash;

          import it.unimi.dsi.fastutil.objects.Object2IntMap;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandManager;
          import net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.enchantment.Enchantment;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.ItemStack;
          import net.minecraft.network.packet.c2s.play.UpdateSelectedSlotC2SPacket;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.entry.RegistryEntry;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          /**
           * Lunge swap dash.
           *
           * Alur tiap dash (semua di 1 game tick):
           *  START tick : pindah ke spear Lunge + tekan tombol serang (jab)
           *  END tick   : balik ke item semula
           */
          public class SpearDashClient implements ClientModInitializer {
              public static KeyBinding dashKey;

              private static int cooldown = 0;
              private static int restoreSlot = -1;
              private static int restoreDelay = 0;
              private static boolean openConfig = false;

              @Override
              public void onInitializeClient() {
                  SpearConfig.get();

                  KeyBinding.Category category = KeyBinding.Category.create(Identifier.of("speardash", "main"));
                  dashKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                          "key.speardash.dash", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_G, category));

                  ClientCommandRegistrationCallback.EVENT.register((dispatcher, registryAccess) -> {
                      dispatcher.register(ClientCommandManager.literal("spear").executes(ctx -> {
                          SpearConfig c = SpearConfig.get();
                          c.enabled = !c.enabled;
                          SpearConfig.save();
                          ctx.getSource().sendFeedback(Text.literal("Spear Dash: " + (c.enabled ? "ON" : "OFF")));
                          return 1;
                      }));
                      dispatcher.register(ClientCommandManager.literal("spc").executes(ctx -> {
                          openConfig = true;
                          return 1;
                      }));
                  });

                  ClientTickEvents.START_CLIENT_TICK.register(SpearDashClient::onStartTick);
                  ClientTickEvents.END_CLIENT_TICK.register(SpearDashClient::onEndTick);
              }

              private static void onStartTick(MinecraftClient mc) {
                  if (cooldown > 0) {
                      cooldown--;
                  }

                  ClientPlayerEntity player = mc.player;
                  if (player == null || mc.getNetworkHandler() == null) {
                      restoreSlot = -1;
                      return;
                  }

                  SpearConfig cfg = SpearConfig.get();
                  if (!cfg.enabled || dashKey == null || !dashKey.isPressed()) return;
                  if (mc.currentScreen != null) return;
                  if (restoreSlot >= 0 || cooldown > 0) return;
                  if (player.isUsingItem()) return;

                  PlayerInventory inv = player.getInventory();
                  int current = inv.getSelectedSlot();
                  if (isSpear(inv.getStack(current))) return; // lagi pegang spear = jab biasa

                  if (player.getHungerManager().getFoodLevel() < cfg.minHunger) return;

                  int spear = findSpear(inv, cfg);
                  if (spear < 0 || spear == current) return;

                  selectSlot(mc, player, spear);
                  KeyBinding.onKeyPressed(InputUtil.fromTranslationKey(mc.options.attackKey.getBoundKeyTranslationKey()));

                  restoreSlot = current;
                  restoreDelay = cfg.swapBackDelay;
                  cooldown = cfg.intervalTicks;
              }

              private static void onEndTick(MinecraftClient mc) {
                  if (restoreSlot >= 0) {
                      if (restoreDelay > 0) {
                          restoreDelay--;
                      } else {
                          if (mc.player != null && mc.getNetworkHandler() != null) {
                              selectSlot(mc, mc.player, restoreSlot);
                          }
                          restoreSlot = -1;
                      }
                  }

                  if (openConfig) {
                      openConfig = false;
                      mc.setScreen(new SpearConfigScreen(null));
                  }
              }

              private static void selectSlot(MinecraftClient mc, ClientPlayerEntity player, int slot) {
                  player.getInventory().setSelectedSlot(slot);
                  mc.getNetworkHandler().sendPacket(new UpdateSelectedSlotC2SPacket(slot));
              }

              private static int findSpear(PlayerInventory inv, SpearConfig cfg) {
                  if (cfg.spearSlot >= 1 && cfg.spearSlot <= 9) {
                      int i = cfg.spearSlot - 1;
                      ItemStack s = inv.getStack(i);
                      if (isSpear(s) && (!cfg.requireLunge || lungeLevel(s) > 0)) return i;
                      return -1;
                  }
                  int best = -1;
                  int bestLevel = -1;
                  for (int i = 0; i < 9; i++) {
                      ItemStack s = inv.getStack(i);
                      if (!isSpear(s)) continue;
                      int level = lungeLevel(s);
                      if (cfg.requireLunge && level <= 0) continue;
                      if (level > bestLevel) {
                          best = i;
                          bestLevel = level;
                      }
                  }
                  return best;
              }

              private static boolean isSpear(ItemStack stack) {
                  return !stack.isEmpty() && Registries.ITEM.getId(stack.getItem()).getPath().endsWith("_spear");
              }

              private static int lungeLevel(ItemStack stack) {
                  int best = 0;
                  Identifier lunge = Identifier.ofVanilla("lunge");
                  for (Object2IntMap.Entry<RegistryEntry<Enchantment>> e : stack.getEnchantments().getEnchantmentEntries()) {
                      if (e.getKey().matchesId(lunge)) {
                          best = Math.max(best, e.getIntValue());
                      }
                  }
                  return best;
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/speardash
          cat > src/main/java/com/speardash/SpearConfigScreen.java <<'EOF_FILE'
          package com.speardash;

          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.gui.widget.SliderWidget;
          import net.minecraft.text.Text;

          import java.util.function.IntConsumer;
          import java.util.function.IntFunction;

          public class SpearConfigScreen extends Screen {
              private final Screen parent;

              public SpearConfigScreen(Screen parent) {
                  super(Text.literal("Spear Dash Config"));
                  this.parent = parent;
              }

              @Override
              protected void init() {
                  SpearConfig c = SpearConfig.get();
                  int w = 220;
                  int x = this.width / 2 - w / 2;
                  int y = Math.max(10, this.height / 2 - 100);
                  int step = 24;

                  ButtonWidget header = ButtonWidget.builder(Text.literal("Spear Dash Config"), b -> {})
                          .dimensions(x, y, w, 20).build();
                  header.active = false;
                  this.addDrawableChild(header);
                  y += step;

                  this.addDrawableChild(ButtonWidget.builder(onOff("Aktif", c.enabled), b -> {
                      c.enabled = !c.enabled;
                      b.setMessage(onOff("Aktif", c.enabled));
                  }).dimensions(x, y, w, 20).build());
                  y += step;

                  this.addDrawableChild(new IntSlider(x, y, w, 20, "Interval (tick)", 1, 40, c.intervalTicks,
                          v -> c.intervalTicks = v, v -> String.valueOf(v)));
                  y += step;

                  this.addDrawableChild(new IntSlider(x, y, w, 20, "Min hunger", 0, 20, c.minHunger,
                          v -> c.minHunger = v, v -> String.valueOf(v)));
                  y += step;

                  this.addDrawableChild(new IntSlider(x, y, w, 20, "Slot spear", 0, 9, c.spearSlot,
                          v -> c.spearSlot = v, v -> v == 0 ? "Auto" : String.valueOf(v)));
                  y += step;

                  this.addDrawableChild(new IntSlider(x, y, w, 20, "Delay swap balik (tick)", 0, 5, c.swapBackDelay,
                          v -> c.swapBackDelay = v, v -> String.valueOf(v)));
                  y += step;

                  this.addDrawableChild(ButtonWidget.builder(onOff("Wajib Lunge", c.requireLunge), b -> {
                      c.requireLunge = !c.requireLunge;
                      b.setMessage(onOff("Wajib Lunge", c.requireLunge));
                  }).dimensions(x, y, w, 20).build());
                  y += step + 6;

                  this.addDrawableChild(ButtonWidget.builder(Text.literal("Selesai"), b -> this.close())
                          .dimensions(x, y, w, 20).build());
              }

              private static Text onOff(String label, boolean value) {
                  return Text.literal(label + ": " + (value ? "ON" : "OFF"));
              }

              @Override
              public void close() {
                  if (this.client != null) {
                      this.client.setScreen(parent);
                  }
              }

              @Override
              public void removed() {
                  SpearConfig.save();
              }

              private static class IntSlider extends SliderWidget {
                  private final String label;
                  private final int min;
                  private final int max;
                  private final IntConsumer setter;
                  private final IntFunction<String> format;

                  IntSlider(int x, int y, int width, int height, String label, int min, int max, int value,
                            IntConsumer setter, IntFunction<String> format) {
                      super(x, y, width, height, Text.empty(), (double) (value - min) / (max - min));
                      this.label = label;
                      this.min = min;
                      this.max = max;
                      this.setter = setter;
                      this.format = format;
                      updateMessage();
                  }

                  private int current() {
                      return min + (int) Math.round(this.value * (max - min));
                  }

                  @Override
                  protected void updateMessage() {
                      setMessage(Text.literal(label + ": " + format.apply(current())));
                  }

                  @Override
                  protected void applyValue() {
                      setter.accept(current());
                  }
              }
          }
          EOF_FILE

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: speardash
          path: build/libs/*.jar

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spear Dash build ${{ github.run_number }}
          files: build/libs/*.jar
